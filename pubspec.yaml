name: skyfit_pro
description: SkyFit Pro - Secure Flutter WebApp with Health & Weather Integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  http: ^1.2.2
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  video_player: ^2.9.1
  crypto: ^3.0.3
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/images/
