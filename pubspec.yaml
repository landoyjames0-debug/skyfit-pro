name: skyfit_pro
description: SkyFit Pro - Secure Flutter WebApp with Health & Weather Integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Biometrics
  local_auth: ^2.3.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # State Management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.2

  # Image Picker & Cropper
  image_picker: ^1.1.2
  # FIX: Added ^ so pub can pick compatible patch versions
  image_cropper: ^11.0.0

  # Video player for activity sample videos
  video_player: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # FIX: Declare all asset folders so Flutter can bundle them.
  # Without this, any reference to assets/videos/*.mp4 crashes at runtime.
  assets:
    - assets/videos/
    - assets/images/