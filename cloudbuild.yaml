# M4 - CI/CD: Google Cloud Build configuration
steps:
  # Step 1: Build Docker image with secrets from substitution variables
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'FIREBASE_API_KEY=$_FIREBASE_API_KEY'
      - '--build-arg'
      - 'FIREBASE_APP_ID=$_FIREBASE_APP_ID'
      - '--build-arg'
      - 'FIREBASE_MESSAGING_SENDER_ID=$_FIREBASE_MESSAGING_SENDER_ID'
      - '--build-arg'
      - 'FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID'
      - '--build-arg'
      - 'FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN'
      - '--build-arg'
      - 'FIREBASE_STORAGE_BUCKET=$_FIREBASE_STORAGE_BUCKET'
      - '--build-arg'
      - 'OPENWEATHER_API_KEY=$_OPENWEATHER_API_KEY'
      - '--build-arg'
      - 'GOOGLE_WEB_CLIENT_ID=$_GOOGLE_WEB_CLIENT_ID'
      - '-t'
      - 'asia-east1-docker.pkg.dev/$PROJECT_ID/skyfit-pro/skyfit-pro:$COMMIT_SHA'
      - '-t'
      - 'asia-east1-docker.pkg.dev/$PROJECT_ID/skyfit-pro/skyfit-pro:latest'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-east1-docker.pkg.dev/$PROJECT_ID/skyfit-pro/skyfit-pro:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-east1-docker.pkg.dev/$PROJECT_ID/skyfit-pro/skyfit-pro:latest']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'skyfit-pro'
      - '--image=asia-east1-docker.pkg.dev/$PROJECT_ID/skyfit-pro/skyfit-pro:$COMMIT_SHA'
      - '--region=asia-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=10'

images:
  - 'asia-east1-docker.pkg.dev/$PROJECT_ID/skyfit-pro/skyfit-pro:$COMMIT_SHA'
  - 'asia-east1-docker.pkg.dev/$PROJECT_ID/skyfit-pro/skyfit-pro:latest'

options:
  logging: CLOUD_LOGGING_ONLY
